# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: 'frontend/build/index.html'
      - id: end-of-file-fixer
        exclude: 'frontend/build/index.html'
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      - id: mixed-line-ending
      - id: check-case-conflict

  # Go specific hooks
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: Go Format
        description: Runs gofmt on all Go files
      - id: go-vet
        name: Go Vet
        description: Runs go vet on all packages
      - id: go-imports
        name: Go Imports
        description: Organizes imports in Go files
      - id: golangci-lint
        name: Golangci-lint
        description: Run golangci-lint
        args: ['--fast']
      - id: go-unit-tests
        name: Go Unit Tests
        description: Run Go unit tests
        args: ['./...']

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ['--fix', '--disable', 'MD013', 'MD033']

  # Prettier for web files
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [html, css, javascript, json]
        exclude: 'frontend/build/index.html'
