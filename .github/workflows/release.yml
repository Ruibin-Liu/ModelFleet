name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binaries
        run: |
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_REF#refs/tags/}" -o modelfleet-linux-amd64 .
          
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_REF#refs/tags/}" -o modelfleet-linux-arm64 .
          
          # macOS AMD64
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_REF#refs/tags/}" -o modelfleet-darwin-amd64 .
          
          # macOS ARM64 (M1/M2/M3)
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_REF#refs/tags/}" -o modelfleet-darwin-arm64 .
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_REF#refs/tags/}" -o modelfleet-windows-amd64.exe .

      - name: Create checksums
        run: |
          sha256sum modelfleet-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            modelfleet-linux-amd64
            modelfleet-linux-arm64
            modelfleet-darwin-amd64
            modelfleet-darwin-arm64
            modelfleet-windows-amd64.exe
            checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
